<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Train Ticket</title>
    </head>
    <body>
        <h1>Train Ticket</h1>
        <div class="train-ticket">
            <div class="top-border">
                <div class="top-border-text">
                    <h2>Off-Peak Day Return</h2>
                </div>
                <div class="top-border-text">
                    <h2>Return</h2>
                </div>
            </div>
                <div class="ticket-background">
                    <div class="left-text">
                        <div class="valid">
                            <h2>Valid for one journey from</h2>
                        </div>
                        <div class="destinations">
                            <h2>Manchester</h2>
                            <h2>to Leeds</h2>
                        </div>
                        <div class="restrictions">
                            <h2>See restrictions</h2>
                            <h2>Adult Standard Class</h2>
                        </div>
                    </div>
                    <div class="date">
                        <h4>Date of travel</h4>
                        <h2>03-JUN-26</h2>
                    </div>
                </div>
            <div class="bottom-border">
                <div class="logo">
                    <div class="lines">
                    </div>
                    <div class="serial-number">
                        <h2>XXXXX-XXXX-XXXX-XX-XX-XXX</h2>
                        <h2>0953:030626</h2>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
